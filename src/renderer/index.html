<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>POS</title>
<style>
  :root {
    --bg: #F6F4F1;
    --surface: #FFFFFF;
    --rail-bg: #1F2421;
    --rail-text: #E8E6E1;
    --rail-text-dim: #9AA39D;
    --ink: #1B1B18;
    --ink-soft: #6B6660;
    --border: #E2DED7;
    --accent: #2F6F62;
    --accent-hover: #275A50;
    --accent-ink: #FFFFFF;
    --warn: #B5541E;
    --warn-bg: #FBEDE4;
    --warn-border: #E7C4AC;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  #app {
    display: grid;
    grid-template-columns: 200px 1fr 340px;
    height: 100vh;
  }

  /* ---------- Riel lateral ---------- */
  #rail {
    background: var(--rail-bg);
    color: var(--rail-text);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  #rail .register-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #railLogo {
    max-width: 100%;
    max-height: 56px;
    object-fit: contain;
    align-self: flex-start;
  }
  #rail .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--rail-text-dim);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6B6660;
    flex-shrink: 0;
  }
  .dot.online { background: #4E9A76; }
  .dot.offline { background: #B5541E; }

  #rail .rail-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #rail .rail-label {
    font-size: 12px;
    color: var(--rail-text-dim);
  }
  #rail .rail-value {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  #btnSyncCatalog {
    margin-top: auto;
    background: transparent;
    border: 1px solid #3A423E;
    color: var(--rail-text);
    padding: 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
  }
  #btnSyncCatalog:hover { background: #2A302C; }

  #btnErrors {
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn-border);
    padding: 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    display: none; /* se muestra solo si hay errores */
  }

  /* ---------- Catálogo ---------- */
  #catalog {
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    overflow: hidden;
  }
  #searchRow {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  #search {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    background: var(--surface);
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  #categoryTabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .cat-tab {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
  }
  .cat-tab.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  #productGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    overflow-y: auto;
    padding: 12px 14px 24px 6px;
    align-content: start;
  }
  .product-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 96px;
    text-align: left;
  }
  .product-tile .p-image {
    width: 100%;
    height: 84px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 8px;
    background: var(--bg);
  }
  .product-tile .p-image-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .product-tile:hover { border-color: var(--accent); }
  .product-tile:active { background: #F0F6F4; }
  .product-tile .p-name {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .product-tile .p-price {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .product-tile .p-stock {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .product-tile.no-stock {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .product-tile { position: relative; }
  .tile-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--ink);
    color: #fff;
    border-radius: 999px;
    padding: 3px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    z-index: 1;
  }
  .tile-badge .tb-qty { font-variant-numeric: tabular-nums; }
  .tile-badge .tb-remove {
    cursor: pointer;
    opacity: 0.7;
    line-height: 1;
    padding: 0 2px;
  }
  .tile-badge .tb-remove:hover { opacity: 1; }

  #emptyState {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }

  /* ---------- Carrito ---------- */
  #cartPanel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  #cartPanel h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 12px;
  }
  #cartItems {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #cartEmpty {
    color: var(--ink-soft);
    font-size: 13px;
    padding: 30px 0;
    text-align: center;
  }
  .cart-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .cart-line .cl-name {
    flex: 1;
    font-size: 13px;
    line-height: 1.3;
  }
  .cart-line .cl-qty {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cl-qty button {
    width: 22px; height: 22px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .cl-qty span { font-size: 13px; min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }
  .cart-line .cl-subtotal {
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    text-align: right;
  }
  .cart-line .cl-remove {
    background: none; border: none; color: var(--ink-soft);
    cursor: pointer; font-size: 15px; padding: 0 2px;
  }
  .cart-line .cl-remove:hover { color: var(--warn); }

  #paymentRow {
    display: flex;
    gap: 8px;
    margin: 14px 0 10px;
  }
  .pay-btn {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    cursor: pointer;
  }
  .pay-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  #cashRow {
    display: none;
    flex-direction: column;
    gap: 6px;
    margin: 4px 0 10px;
  }
  #cashRow.show { display: flex; }
  .cash-label { font-size: 12px; color: var(--ink-soft); }
  #cashPills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cash-pill {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .cash-pill:hover { border-color: var(--accent); }
  .cash-pill.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  #cashReceived {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  #cashReceived:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #cashReceived.insufficient { border-color: var(--warn); }
  #changeRow {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
  }
  #changeRow.insufficient #changeAmount { color: var(--warn); }

  #noteRow { margin: 4px 0 10px; }
  .note-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    margin-bottom: 6px;
  }
  #noteText {
    display: none;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    resize: none;
  }
  #noteText.show { display: block; }
  #noteText:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  #totalRow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 8px 0 16px;
  }
  #totalRow .label { font-size: 13px; color: var(--ink-soft); }
  #totalRow .amount { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

  #btnCheckout {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 16px;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  #btnCheckout:hover { background: var(--accent-hover); }
  #btnCheckout:disabled { opacity: 0.5; cursor: not-allowed; }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 220px;
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #toast.show { opacity: 1; }
  #toast.warn { background: var(--warn); }

  /* ---------- Panel de errores (overlay) ---------- */
  #errorOverlay {
    position: fixed;
    inset: 0;
    background: rgba(27, 27, 24, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #errorOverlay.show { display: flex; }
  #errorPanel {
    background: var(--surface);
    border-radius: 10px;
    width: 480px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  #errorPanel h2 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  #errorPanel .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  #errorListBody {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .error-order {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .error-order .eo-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .error-order .eo-items {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .error-order .eo-msg {
    font-size: 12px;
    color: var(--warn);
    margin-bottom: 8px;
  }
  .error-order .eo-actions { display: flex; gap: 8px; }
  .error-order button {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid var(--warn-border);
    background: #fff;
    cursor: pointer;
  }
  #btnCloseErrors {
    margin-top: 14px;
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
  }

  .p-variable-hint {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  /* ---------- Panel de variaciones (overlay) ---------- */
  #variationOverlay {
    position: fixed;
    inset: 0;
    background: rgba(27, 27, 24, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #variationOverlay.show { display: flex; }
  #variationPanel {
    background: var(--surface);
    border-radius: 10px;
    width: 420px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  #variationPanel h2 { font-size: 16px; margin: 0 0 4px; }
  #variationPanel .subtitle { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  #variationListBody {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .variation-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    text-align: left;
    font-size: 13px;
  }
  .variation-row:hover { border-color: var(--accent); }
  .variation-row:disabled { opacity: 0.45; cursor: not-allowed; }
  .variation-row .vr-label { flex: 1; font-weight: 500; }
  .variation-row .vr-price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .variation-row .vr-stock { font-size: 11px; color: var(--ink-soft); }
  #btnCloseVariations {
    margin-top: 14px;
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
  }

  /* ---------- Selector de cliente ---------- */
  #customerRow {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  #btnSelectCustomer {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  #btnSelectCustomer.has-customer { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #btnClearCustomer {
    display: none;
    width: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    font-size: 14px;
    color: var(--ink-soft);
  }
  #btnClearCustomer.show { display: block; }

  #customerOverlay {
    position: fixed;
    inset: 0;
    background: rgba(27, 27, 24, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #customerOverlay.show { display: flex; }
  #customerPanel {
    background: var(--surface);
    border-radius: 10px;
    width: 420px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  #customerPanel h2 { font-size: 16px; margin: 0 0 12px; }
  #customerSearch {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    margin-bottom: 12px;
  }
  #customerListBody {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .customer-row {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    text-align: left;
    font-size: 13px;
  }
  .customer-row:hover { border-color: var(--accent); }
  .customer-row .cr-name { font-weight: 600; }
  .customer-row .cr-detail { color: var(--ink-soft); font-size: 12px; }
  #btnCloseCustomers {
    margin-top: 14px;
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
  }
  #btnCash {
    background: transparent;
    border: 1px solid #3A423E;
    color: var(--rail-text);
    padding: 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
  }
  #btnCash:hover { background: #2A302C; }
  #btnCash.closed { border-color: var(--warn); color: #E9A882; }

  #cashOverlay {
    position: fixed;
    inset: 0;
    background: rgba(27, 27, 24, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 11;
  }
  #cashOverlay.show { display: flex; }
  #cashPanel {
    background: var(--surface);
    border-radius: 10px;
    width: 460px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  #cashPanel h2 { font-size: 16px; margin: 0 0 14px; }
  #cashBody { overflow-y: auto; }
  .cash-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 5px 0;
    font-variant-numeric: tabular-nums;
  }
  .cash-line.total {
    border-top: 1px solid var(--border);
    margin-top: 6px;
    padding-top: 10px;
    font-weight: 700;
    font-size: 15px;
  }
  .cash-line .muted { color: var(--ink-soft); }
  .cash-section-title {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 16px 0 6px;
  }
  #cashPanel input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    margin-bottom: 8px;
  }
  #cashPanel .cash-action-btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  #cashPanel .cash-action-btn.secondary {
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  #cashPanel .cash-action-btn.danger { background: var(--warn); }
  .cash-row-2 { display: flex; gap: 8px; }
  .diff-ok { color: var(--accent); font-weight: 700; }
  .diff-bad { color: var(--warn); font-weight: 700; }
  #btnCloseCash {
    margin-top: 14px;
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="rail">
      <img id="railLogo" src="" alt="" style="display:none;" />
      <div class="register-name" id="railRegisterName">Caja</div>

      <div class="status-row">
        <span class="dot" id="connDot"></span>
        <span id="connLabel">Verificando...</span>
      </div>

      <div class="rail-section">
        <span class="rail-label">Último ticket</span>
        <span class="rail-value" id="lastTicket">—</span>
      </div>

      <div class="rail-section">
        <span class="rail-label">Catálogo</span>
        <span class="rail-value" id="catalogSyncedAt">sin sincronizar</span>
      </div>

      <button id="btnCash">Caja</button>
      <button id="btnErrors">⚠ <span id="errorCount">0</span> con error</button>
      <button id="btnSyncCatalog">Sincronizar catálogo</button>
    </div>

    <div id="catalog">
      <div id="searchRow">
        <input id="search" placeholder="Buscar producto o SKU..." />
      </div>
      <div id="categoryTabs"></div>
      <div id="productGrid"></div>
    </div>

    <div id="cartPanel">
      <h2>Carrito</h2>
      <div id="customerRow">
        <button id="btnSelectCustomer">Cliente: Ninguno</button>
        <button id="btnClearCustomer" title="Quitar cliente">×</button>
      </div>
      <div id="cartItems">
        <div id="cartEmpty">Toca un producto para agregarlo</div>
      </div>

      <div id="paymentRow">
        <button class="pay-btn active" data-method="cash">Efectivo</button>
        <button class="pay-btn" data-method="card">Tarjeta</button>
      </div>

      <div id="cashRow">
        <label class="cash-label" for="cashReceived">Recibido</label>
        <div id="cashPills"></div>
        <input id="cashReceived" type="number" step="0.01" min="0" placeholder="0.00" />
        <div id="changeRow">
          <span class="cash-label">Cambio</span>
          <span id="changeAmount">$0.00</span>
        </div>
      </div>

      <div id="noteRow">
        <label class="note-toggle">
          <input type="checkbox" id="noteCheckbox" />
          Agregar nota al ticket
        </label>
        <textarea id="noteText" placeholder="Se imprime al final del ticket..." rows="2"></textarea>
      </div>

      <div id="totalRow">
        <span class="label">Total</span>
        <span class="amount" id="totalAmount">$0.00</span>
      </div>

      <button id="btnCheckout" disabled>Cobrar e imprimir</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="errorOverlay">
    <div id="errorPanel">
      <h2>Ventas con error de sincronización</h2>
      <div class="subtitle">No se subieron a WooCommerce. El ticket ya se imprimió.</div>
      <div id="errorListBody"></div>
      <button id="btnCloseErrors">Cerrar</button>
    </div>
  </div>

  <div id="variationOverlay">
    <div id="variationPanel">
      <h2 id="variationTitle">Producto</h2>
      <div class="subtitle">Elige una opción</div>
      <div id="variationListBody"></div>
      <button id="btnCloseVariations">Cancelar</button>
    </div>
  </div>

  <div id="customerOverlay">
    <div id="customerPanel">
      <h2>Buscar cliente</h2>
      <input id="customerSearch" placeholder="Nombre, correo o teléfono..." />
      <div id="customerListBody"></div>
      <button id="btnCloseCustomers">Cancelar</button>
    </div>
  </div>

  <div id="cashOverlay">
    <div id="cashPanel">
      <h2>Control de efectivo</h2>
      <div id="cashBody"></div>
      <button id="btnCloseCash">Cerrar</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
