<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>POS - Scaffold</title>
  <style>
    body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
    #catalog, #cart { padding: 16px; overflow-y: auto; }
    #catalog { flex: 2; border-right: 1px solid #ccc; }
    #cart { flex: 1; display: flex; flex-direction: column; }
    .product { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
    .product:hover { background: #f5f5f5; }
    .cart-item { display: flex; justify-content: space-between; padding: 4px 0; }
    #total { font-size: 1.4em; font-weight: bold; margin-top: 8px; }
    button { padding: 10px; margin-top: 8px; cursor: pointer; }
    #status { font-size: 0.8em; color: #666; padding: 8px 16px; }
    #errorPanel { border-top: 3px solid #c0392b; margin-top: auto; max-height: 40%; overflow-y: auto; }
    .error-order { background: #fdecea; border: 1px solid #e6b0aa; border-radius: 4px; padding: 8px; margin: 6px 0; }
    .error-order .msg { color: #c0392b; font-size: 0.85em; margin: 4px 0; }
    .error-order button { padding: 4px 8px; margin-right: 6px; font-size: 0.8em; }
  </style>
</head>
<body>
  <div id="catalog">
    <h3>Catálogo (local)</h3>
    <input id="search" placeholder="Buscar producto..." />
    <button id="btnSync">Sincronizar catálogo ahora</button>
    <div id="productList"></div>
  </div>
  <div id="cart">
    <h3>Carrito</h3>
    <div id="cartItems"></div>
    <div id="total">Total: $0.00</div>
    <button id="btnCheckout">Cobrar e imprimir</button>
    <div id="status"></div>
    <div id="errorPanel">
      <h4>⚠️ Ventas con error de sincronización</h4>
      <div id="errorList"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
