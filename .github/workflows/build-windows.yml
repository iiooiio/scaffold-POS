name: Build Windows installer

# Se dispara al hacer push de un tag tipo v0.1.0, o manualmente desde la pestaña Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Necesario para que electron-builder pueda crear el release de GitHub con el .exe.
# Sin esto el auto-update no tiene de dónde bajar las actualizaciones.
permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar módulo nativo (better-sqlite3) para Electron
        run: npm run rebuild

      # En push de tag: publica el release (necesario para auto-update).
      # En corrida manual: solo compila, sin publicar.
      - name: Generar instalador y publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:win-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar instalador sin publicar
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist:win

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pos-windows-installer
          path: dist/*.exe
